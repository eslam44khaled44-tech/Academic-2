<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Midnight Student System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="stars-background" id="starsBackground"></div>

    <div class="background-effects"></div>

   <main class="main-container">

    <div class="system-label">
        ACADEMIC SYSTEM
    </div>

    <h1>
        STUDENT PERFORMANCE
        <span>SYSTEM</span>
    </h1>

    <p class="description">
        Academic Results Analysis
    </p>

    <div class="system-status">
        <span class="status-indicator"></span>
        SYSTEM ONLINE
    </div>

    <button class="results-button" onclick="showConsoleInstructions()">
        VIEW RESULTS
        <span>→</span>
    </button>

    <p id="consoleInstructions" class="instructions" hidden>
        Press F12 and select Console to view student reports.
    </p>

</main>
    <script src="sawsan.js"></script>

</body>

</html>
